<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>正在刷新网站缓存</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f3f6f9;
        color: #1f2d3d;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(520px, calc(100% - 40px));
        padding: 36px;
        border: 1px solid #d8e1ea;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 16px 44px rgba(9, 45, 78, 0.1);
        text-align: center;
      }
      .spinner {
        width: 38px;
        height: 38px;
        margin: 0 auto 20px;
        border: 4px solid #dbeaf4;
        border-top-color: #0869a6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      h1 { margin: 0 0 12px; color: #082b50; font-size: 25px; }
      p { margin: 0; line-height: 1.65; color: #5f6f82; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>正在清理旧网站缓存</h1>
      <p id="status" role="status">完成后将自动打开新的个人学术主页。</p>
    </main>
    <script>
      (async () => {
        const status = document.querySelector("#status");

        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ("caches" in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
          }

          status.textContent = "旧缓存已清理，正在打开新主页……";
        } catch (error) {
          console.warn("Legacy cache cleanup was incomplete.", error);
          status.textContent = "正在使用全新地址打开主页……";
        }

        window.setTimeout(() => {
          window.location.replace("/?cache-reset-complete=20260904");
        }, 350);
      })();
    </script>
  </body>
</html>
